<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdCode Studio</title><style>body{margin:0;background:#0c1020;color:#eaf0ff;font:15px system-ui}header{padding:20px 28px;border-bottom:1px solid #29324a;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px}section{background:#151c30;border:1px solid #303a55;border-radius:14px;padding:16px}textarea{width:100%;height:55vh;box-sizing:border-box;resize:vertical;background:#090e1b;color:#c9e5ff;border:1px solid #3b4a68;border-radius:8px;padding:14px;font:13px ui-monospace,monospace}iframe{background:white;width:100%;height:55vh;border:0;border-radius:8px}button{background:#4869ef;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:3px}button:focus-visible{outline:3px solid #fff}small{color:#a9b7d6}@media(max-width:800px){main{grid-template-columns:1fr}textarea,iframe{height:38vh}}</style></head><body><header><div><strong>CrowdCode</strong><br><small>Local prototype • changes saved in this browser</small></div><div><button id="reset">Reset</button><button id="export">Export HTML</button></div></header><main><section><h2>Source editor</h2><p><small>Edit HTML, CSS and JavaScript. Press Ctrl/Cmd+S to save a snapshot.</small></p><textarea id="source" spellcheck="false" aria-label="Source code editor"></textarea><p id="status" role="status"></p></section><section><h2>Live preview</h2><iframe id="preview" title="Sandboxed project preview" sandbox="allow-scripts"></iframe><p><small>Preview is sandboxed and cannot access this studio's browser storage.</small></p></section></main><script>const KEY="crowdcode-editor",source=document.getElementById("source"),frame=document.getElementById("preview"),status=document.getElementById("status");const starter="<!doctype html><html><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Notes</title><style>body{font:16px system-ui;max-width:650px;margin:40px auto;padding:20px;background:#f2f5fb}textarea{width:100%;height:260px;box-sizing:border-box;padding:15px;border:1px solid #aab;border-radius:10px}button{padding:10px;margin-top:12px}</style><h1>Quick Notes</h1><textarea id=\"note\" placeholder=\"Write your notes...\"></textarea><button id=\"download\">Download notes</button><script>document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([document.getElementById('note').value],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};<\\/script></html>";let timer;try{source.value=localStorage.getItem(KEY)||starter}catch{source.value=starter}function render(){const policy='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: blob:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'">';frame.srcdoc=policy+source.value;status.textContent="Preview updated"}function save(){try{localStorage.setItem(KEY,source.value);status.textContent="Saved locally"}catch{status.textContent="Browser storage unavailable; export your work"}}source.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{save();render()},350)});document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});document.getElementById("reset").onclick=()=>{if(confirm("Replace current source with the starter template?")){source.value=starter;save();render()}};document.getElementById("export").onclick=()=>{const url=URL.createObjectURL(new Blob([source.value],{type:"text/html"}));const a=document.createElement("a");a.href=url;a.download="crowdcode-project.html";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
